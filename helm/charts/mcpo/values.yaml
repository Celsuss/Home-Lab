---
namespace: ai-workloads
name: mcpo

# Scaled to zero, chart kept for future MCP servers. See README.md.
#
# Open WebUI 0.11.4 ships native `fetch_url` and memory tools, so the two
# servers configured here are redundant. They were also serving nothing: both
# sub-apps advertised `"paths": {}` (zero tools), so every tool call and
# "Verify connection" failed. Set back to 1 once config.json has a server that
# is known to start — check `/<server>/openapi.json` reports a non-empty
# `paths` before registering it in Open WebUI.
replicaCount: 0

image:
  repository: ghcr.io/open-webui/mcpo
  pullPolicy: IfNotPresent
  tag: "git-788ff92"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
