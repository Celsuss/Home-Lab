---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "rclone-restic.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "rclone-restic.labels" . | nindent 4 }}
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
  # rclone.conf is rendered once at start-up, so roll the gateway when the
  # token or REST login changes in Vault.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "rclone-restic.fullname" . }}
