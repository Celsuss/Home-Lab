---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "romm.fullname" . }}-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "romm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
