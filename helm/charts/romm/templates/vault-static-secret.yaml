---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "romm.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "romm.labels" . | nindent 4 }}
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
  # Metadata API keys are read from env at start-up, so roll RomM when keys
  # are added to Vault. Postgres only reads its password on first init.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "romm.fullname" . }}
