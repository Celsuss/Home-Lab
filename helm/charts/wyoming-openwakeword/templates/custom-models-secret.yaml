{{- if .Values.openwakeword.customModels }}
---
# Binary .tflite files can't live in a ConfigMap's `data`, so custom wake
# word models are shipped as a Secret (base64 values are passed straight
# through). Nothing in here is actually secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wyoming-openwakeword.fullname" . }}-custom-models
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wyoming-openwakeword.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $b64 := .Values.openwakeword.customModels }}
  {{ $name }}: {{ $b64 }}
  {{- end }}
{{- end }}
