{{/*
Create VSO ServiceAccount + VaultAuth for namespaces that don't already have them.
Namespaces with existing VaultAuth "default" (ai-workloads, forgejo, karakeep,
tandoor, utils, woodpecker) are NOT listed here.
*/}}
{{- range .Values.vsoNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-service-account
  namespace: {{ . }}
  labels:
    {{- include "volsync-backups.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vault-auth
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: {{ . }}
  labels:
    {{- include "volsync-backups.labels" $ | nindent 4 }}
    app.kubernetes.io/component: vault-auth
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-role
    serviceAccount: vso-service-account
{{- end }}
