{{/*
One VaultStaticSecret per backup target.
Each syncs the shared Vault secret (homelab/volsync) into a per-PVC K8s Secret
with the per-target RESTIC_REPOSITORY (a folder on the rclone-restic gateway)
injected via transformation.
*/}}
{{- range .Values.backups }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: volsync-{{ .name }}-vss
  namespace: {{ .namespace }}
  labels:
    {{- include "volsync-backups.labels" $ | nindent 4 }}
    app.kubernetes.io/component: backup-secret
spec:
  vaultAuthRef: default
  mount: secret
  type: kv-v2
  path: {{ $.Values.vault.secretPath }}
  refreshAfter: 300s
  destination:
    create: true
    name: volsync-{{ .name }}-secret
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        # The trailing slash is required by the restic REST protocol.
        RESTIC_REPOSITORY:
          text: "{{ $.Values.repository.baseUrl }}/{{ .name }}/"
        RESTIC_PASSWORD:
          text: '{{`{{- .Secrets.RESTIC_PASSWORD -}}`}}'
        RESTIC_REST_USERNAME:
          text: '{{`{{- .Secrets.RESTIC_REST_USERNAME -}}`}}'
        RESTIC_REST_PASSWORD:
          text: '{{`{{- .Secrets.RESTIC_REST_PASSWORD -}}`}}'
        RESTIC_PACK_SIZE:
          text: "{{ $.Values.repository.packSizeMiB }}"
{{- end }}
