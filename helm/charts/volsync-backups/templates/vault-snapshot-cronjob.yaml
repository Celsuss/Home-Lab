{{- if .Values.vaultSnapshot.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  labels:
    {{- include "volsync-backups.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-snapshot
spec:
  schedule: {{ .Values.vaultSnapshot.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: vault-snapshot
            app.kubernetes.io/name: vault-raft-snapshot
        spec:
          restartPolicy: OnFailure
          containers:
            - name: vault-snapshot
              image: {{ .Values.vaultSnapshot.image }}
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export VAULT_ADDR="{{ .Values.vaultSnapshot.vaultAddr }}"
                  export VAULT_TOKEN="$VAULT_ROOT_TOKEN"

                  SNAP_DIR="{{ .Values.vaultSnapshot.snapshotDir }}"
                  SNAP_FILE="$SNAP_DIR/raft-snapshot-$(date +%Y%m%d-%H%M%S).snap"

                  echo "Taking Vault raft snapshot at $(date -u +%Y-%m-%dT%H:%M:%SZ)..."
                  vault operator raft snapshot save "$SNAP_FILE"
                  echo "Snapshot saved: $(ls -lh $SNAP_FILE)"

                  # Keep only the last {{ .Values.vaultSnapshot.keepCount }} snapshots
                  ls -t $SNAP_DIR/raft-snapshot-*.snap 2>/dev/null | tail -n +{{ add1 (int .Values.vaultSnapshot.keepCount) }} | xargs rm -f 2>/dev/null || true
                  echo "Current snapshots:"
                  ls -lh $SNAP_DIR/raft-snapshot-*.snap 2>/dev/null || echo "  (none)"
              env:
                - name: VAULT_ROOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.vaultSnapshot.tokenSecretName }}
                      key: {{ .Values.vaultSnapshot.tokenSecretKey }}
              volumeMounts:
                - name: vault-data
                  mountPath: {{ .Values.vaultSnapshot.snapshotDir }}
          volumes:
            - name: vault-data
              persistentVolumeClaim:
                claimName: {{ .Values.vaultSnapshot.snapshotPvc }}
{{- end }}
