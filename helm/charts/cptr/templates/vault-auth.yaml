{{- if .Values.vault.enabled }}
---
# Named (not `default`) because ai-workloads is shared with open-webui, khoj,
# open-terminal and others - a second VaultAuth called `default` would fight
# over ownership. `vso-service-account` already exists in this namespace; this
# chart only references it, it does not create it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cptr-vault-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cptr.labels" . | nindent 4 }}
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-role
    serviceAccount: vso-service-account
{{- end }}
