{{- if .Values.vault.enabled }}
---
# Holds the cptr API key (sk-cptr-...) that Open WebUI presents to the
# OpenAI-compatible gateway. The key has to be minted in the cptr UI first, so
# this stays disabled until `secret/homelab/cptr` exists - see README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "cptr.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cptr.labels" . | nindent 4 }}
spec:
  vaultAuthRef: cptr-vault-auth
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
{{- end }}
