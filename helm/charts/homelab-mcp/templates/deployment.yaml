---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab-mcp.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab-mcp.selectorLabels" . | nindent 8 }}
        # What the NetworkPolicy selects on.
        app: {{ include "homelab-mcp.fullname" . }}
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            # Optional so search + fetch work before the Vault entry exists.
            # Tokens are read at start-up: restart the pod after adding them.
            - secretRef:
                name: {{ .Values.vault.secretName }}
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
