---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "homelab-mcp.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "homelab-mcp.labels" . | nindent 4 }}
spec:
  vaultAuthRef: homelab-mcp-vault-auth
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
  # Tokens are read once at start-up, so roll the pod when they change.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "homelab-mcp.fullname" . }}
