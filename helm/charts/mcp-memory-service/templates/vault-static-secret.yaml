---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "mcp-memory-service.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-memory-service.labels" . | nindent 4 }}
spec:
  vaultAuthRef: mcp-memory-service-vault-auth
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
  # The API key is read once at start-up, so roll the pod when it changes.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "mcp-memory-service.fullname" . }}
