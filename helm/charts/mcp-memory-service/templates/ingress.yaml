{{- if .Values.ingress.enabled }}
---
# The review dashboard. Every API call it makes needs MCP_API_KEY, which it
# asks for on first load.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-memory-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-memory-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-memory-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
