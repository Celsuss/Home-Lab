---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wyoming-piper.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wyoming-piper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wyoming-piper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wyoming-piper.labels" . | nindent 8 }}
    spec:
      {{- if .Values.piper.customVoices }}
      initContainers:
        # Fetch custom (non-catalogue) voices into the voice cache once and
        # normalise their config so HA lists them with the catalogue voices
        # (see piper.customVoices in values.yaml). Existing files are kept;
        # only the small JSON is rewritten, so restarts are cheap.
        - name: custom-voices
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python3
            - -c
            - |
              import json, os, urllib.request
              voices = json.loads(os.environ["CUSTOM_VOICES"])
              os.chdir("/data")
              def fetch(path, url):
                  if os.path.getsize(path) if os.path.exists(path) else 0:
                      print(path, "already present"); return
                  print("downloading", path)
                  urllib.request.urlretrieve(url, path + ".part")
                  os.replace(path + ".part", path)
              for v in voices:
                  name = v["name"]
                  fetch(name + ".onnx", v["onnxUrl"])
                  fetch(name + ".onnx.json", v["jsonUrl"])
                  parts = name.split("-")
                  lang = v.get("language") or parts[0]
                  with open(name + ".onnx.json") as f:
                      cfg = json.load(f)
                  cfg.setdefault("language", {})["code"] = lang
                  if not cfg.get("dataset") and len(parts) >= 2:
                      cfg["dataset"] = parts[1]
                  q = cfg.setdefault("audio", {}).get("quality")
                  if (not q or q == "training_dir") and len(parts) >= 3:
                      cfg["audio"]["quality"] = parts[2]
                  with open(name + ".onnx.json", "w") as f:
                      json.dump(cfg, f, indent=2)
                  print(name, "->", cfg["language"]["code"], cfg.get("dataset"), cfg["audio"].get("quality"))
          env:
            - name: CUSTOM_VOICES
              value: {{ .Values.piper.customVoices | toJson | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint (docker_run.sh) already passes
          # --uri tcp://0.0.0.0:10200 --data-dir /data; args here are appended.
          args:
            - --voice
            - {{ .Values.piper.voice | quote }}
            - --length-scale
            - {{ .Values.piper.lengthScale | quote }}
            - --sentence-silence
            - {{ .Values.piper.sentenceSilence | quote }}
            {{- if .Values.piper.updateVoices }}
            - --update-voices
            {{- end }}
            {{- range .Values.piper.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: wyoming
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wyoming-piper.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
