---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wyoming-piper.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wyoming-piper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wyoming-piper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wyoming-piper.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image entrypoint (docker_run.sh) already passes
          # --uri tcp://0.0.0.0:10200 --data-dir /data; args here are appended.
          args:
            - --voice
            - {{ .Values.piper.voice | quote }}
            - --length-scale
            - {{ .Values.piper.lengthScale | quote }}
            - --sentence-silence
            - {{ .Values.piper.sentenceSilence | quote }}
            {{- if .Values.piper.updateVoices }}
            - --update-voices
            {{- end }}
            {{- range .Values.piper.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: wyoming
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wyoming-piper.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
