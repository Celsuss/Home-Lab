---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-terminal.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "open-terminal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "open-terminal.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
