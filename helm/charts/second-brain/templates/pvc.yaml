---
# The git clone. Not backed up on purpose - see values.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "second-brain.fullname" . }}-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "second-brain.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.storage }}
