{{/*
Tailnet access. Backed by the oauth2-proxy only when auth.protectTailnet is on,
which it is not and cannot be while Kanidm lives on a `.local` domain - an OIDC
login needs the *browser* to reach the provider, and phones intercept `.local`
for mDNS before any resolver sees it. See values.yaml and README.md.

Otherwise this backs onto the app directly, and the tailnet's own device
authentication is the boundary.
*/}}
{{- $args := dict "Values" .Values "fullname" (include "openhands.fullname" .) "labels" (include "openhands.labels" . | trim) "namespace" .Values.namespace -}}
{{- if and .Values.auth.enabled .Values.auth.protectTailnet -}}
{{- $_ := set $args "serviceName" (include "openhands.authFullname" .) -}}
{{- $_ := set $args "servicePort" .Values.auth.service.port -}}
{{- end -}}
{{ include "homelab-common.tailscale-ingress" $args }}
