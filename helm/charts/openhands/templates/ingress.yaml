{{- if .Values.ingress.enabled }}
---
# Routes the whole port, not just /canvas/: the SPA lives under /canvas/ but it
# talks to /api and /sockets at the root of the same listener. Traefik proxies
# the websocket on /sockets with no annotations needed.
#
# With auth enabled the backend is the oauth2-proxy, which proxies the same
# whole port onwards - so /oauth2/* is served by the gate and everything else
# reaches the app only after a Kanidm login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openhands.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            {{- if .Values.auth.enabled }}
            name: {{ include "openhands.authFullname" . }}
            port:
              number: {{ .Values.auth.service.port }}
            {{- else }}
            name: {{ include "openhands.fullname" . }}
            port:
              number: {{ .Values.service.port }}
            {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
{{- end }}
