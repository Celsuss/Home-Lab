{{- if and .Values.auth.enabled .Values.vault.enabled }}
---
# Syncs secret/homelab/openhands-auth into the `openhands-auth-secrets` Secret:
# the Kanidm OAuth2 client id and basic secret, plus the cookie-signing key.
# Kept apart from the app's own secret so the subscription token and the SSO
# credentials do not share a blast radius. The proxy pod will not start without
# it, so the Vault path must exist before this chart syncs - see README.md.
#
# Reuses the named VaultAuth from vault-auth.yaml; a second `default` VaultAuth
# in this shared namespace would fight over ownership.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "openhands.authFullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  vaultAuthRef: openhands-vault-auth
  mount: secret
  type: kv-v2
  path: {{ .Values.auth.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.auth.vault.secretName }}
    overwrite: true
{{- end }}
