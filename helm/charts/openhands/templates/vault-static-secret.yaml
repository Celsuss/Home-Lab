{{- if .Values.vault.enabled }}
---
# Syncs secret/homelab/openhands into the `openhands-secrets` Secret: the Claude
# Code subscription token, the settings-encryption key and the agent-server API
# key. The pod cannot start without it, so the Vault path must exist before this
# chart syncs - see README.md.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "openhands.fullname" . }}-vss
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  vaultAuthRef: openhands-vault-auth
  mount: secret
  type: kv-v2
  path: {{ .Values.vault.secretPath }}
  refreshAfter: 60s
  destination:
    create: true
    name: {{ .Values.vault.secretName }}
    overwrite: true
{{- end }}
