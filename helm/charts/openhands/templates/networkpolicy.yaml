{{- if .Values.networkPolicy.enabled }}
---
# OpenHands hands an AI agent a shell in this pod, on the node that is also the
# Arch desktop. This policy - plus `automountServiceAccountToken: false`, no
# hostPath mount and no Docker socket - is the whole containment story.
#
# K3s enforces policies with kube-router unless started with
# `--disable-network-policy`, which this cluster does not (see
# ansible/roles/k3s/templates/config.yaml.j2). A policy is silently inert if the
# controller is off, so verify after deploying - see README.md. kube-router
# REJECTs rather than DROPs, so a blocked connection is an *instant* curl
# error 7, never a hang.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openhands.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "openhands.fullname" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Who may reach port 8000. Traefik is NOT on this list while the gate is up:
    # LAN traffic has to come through the oauth2-proxy, so going around the
    # login is not a matter of knowing the Service name. The tailscale proxy is
    # here only because the tailnet path deliberately bypasses the gate (see
    # auth.protectTailnet). No other pod in this namespace can reach it.
    - from:
        {{- if .Values.auth.enabled }}
        # oauth2-proxy - the only way in from the LAN.
        - podSelector:
            matchLabels:
              app: {{ include "openhands.authFullname" . }}
        {{- end }}
        {{- if or (not .Values.auth.enabled) (not .Values.auth.protectTailnet) }}
        # Tailscale proxy pods. Present because the tailnet path does not go
        # through the gate - Kanidm sits on a `.local` name a phone cannot
        # resolve, so tailnet device auth is the boundary there instead. See
        # auth.protectTailnet in values.yaml.
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.tailscaleNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.tailscalePodLabels | nindent 14 }}
        {{- end }}
        {{- if not .Values.auth.enabled }}
        # Traefik direct. Only when the gate is off entirely, which means
        # everyone on the LAN can drive the agent - for debugging the gate,
        # not for running that way.
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.traefikNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.traefikPodLabels | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.ingress.configureJobPodLabels }}
        # The PostSync hook, which reaches the settings API over the Service.
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dnsNamespaceLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress.allowed }}
    # {{ .name }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
          {{- with .namespaceLabels }}
          namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    # Everything else: the public internet only - api.anthropic.com for the
    # model calls, registry.npmjs.org for the ACP adapter, GitHub for repos.
    # Every RFC1918 range is carved out, so the LAN, the router, Vault and every
    # other namespace are unreachable except through the named rules above.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.networkPolicy.egress.blockedCIDRs | nindent 14 }}
{{- end }}
