---
k8s-gateway:
  domain: homelab.local
  watchedResources:
    - Ingress
  # Override extraZonePlugins to forward unmatched queries to public DNS
  # instead of /etc/resolv.conf (which points to CoreDNS and creates a loop
  # when CoreDNS forwards homelab.local back to k8s-gateway).
  extraZonePlugins:
    - name: log
    - name: errors
    - name: health
      configBlock: |-
        lameduck 5s
    - name: ready
    - name: prometheus
      parameters: 0.0.0.0:9153
    - name: forward
      parameters: . 8.8.8.8 1.1.1.1
    - name: loop
    - name: reload
    - name: loadbalance
  # Enable fallthrough so queries not matched by k8s_gateway (e.g. Kanidm
  # which uses IngressRouteTCP) fall through to the file plugin below.
  fallthrough:
    enabled: true
  # Static DNS entry for Kanidm (uses IngressRouteTCP, not standard Ingress)
  # so k8s-gateway won't auto-discover it. We use a zone file with the
  # Traefik LoadBalancer IP (192.168.0.142).
  zoneFiles:
    - filename: kanidm.db
      domains: kanidm.homelab.local
      contents: |
        kanidm.homelab.local.   IN  SOA sns.dns.icann.org. noc.dns.icann.org. 2015082541 7200 3600 1209600 3600
        kanidm.homelab.local.   IN  A   192.168.0.142
    # TEMPORARY DIAGNOSTIC - remove once the tailnet DNS question is settled.
    #
    # `.local` is reserved for mDNS (RFC 6762) and phones intercept it before it
    # reaches any unicast resolver, which is the suspected reason Tailscale
    # split DNS cannot resolve *.homelab.local on a phone. This zone is the
    # control: same resolver, same target IP, a TLD that is NOT .local.
    # If a tailnet phone resolves this but not kanidm.homelab.local, the TLD is
    # the blocker. Expect a Traefik 404 - no IngressRoute matches this name,
    # which is fine: the 404 itself proves resolution plus reachability.
    - filename: test-internal.db
      domains: test.homelab.internal
      contents: |
        test.homelab.internal.   IN  SOA sns.dns.icann.org. noc.dns.icann.org. 2015082541 7200 3600 1209600 3600
        test.homelab.internal.   IN  A   192.168.0.142
