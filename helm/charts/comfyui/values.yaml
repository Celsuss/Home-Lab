---
replicaCount: 1

namespace: ai-workloads

image:
  # Actively maintained NVIDIA/CUDA ComfyUI image (entrypoint manages the
  # comfy user via WANTED_UID/WANTED_GID and bootstraps a venv on first run).
  repository: mmartial/comfyui-nvidia-docker
  pullPolicy: IfNotPresent
  # Pin to a dated build, not bare "latest" — a "latest" entrypoint change is
  # what broke the pod (it now starts as the comfytoo user, not root).
  # CUDA 13.0 so the entrypoint installs torch/torchvision/torchaudio from the
  # cu130 index together (the 12.9 image mixed cu130 torch with cu129
  # torchaudio and crashed on import). Driver 615 supports up to CUDA 13.4.
  tag: "ubuntu24_cuda13.0-20261018"

serviceAccount:
  create: true
  annotations: {}
  name: ""

env:
  # Map the in-container "comfy" user to the fsGroup below so the mounted
  # volumes are writable.
  - name: WANTED_UID
    value: "1000"
  - name: WANTED_GID
    value: "1000"
  # ComfyUI-Manager security policy (normal = allow installing custom nodes).
  - name: SECURITY_LEVEL
    value: "normal"
  # Keep models, custom_nodes, input/output and user data in /basedir instead
  # of inside the ComfyUI source tree. Must match persistence.baseDir.
  - name: BASE_DIRECTORY
    value: "/basedir"
  # Upstream-recommended: install packages with uv instead of pip (much faster
  # first boot; also sets ComfyUI-Manager's use_uv).
  - name: USE_UV
    value: "true"

podSecurityContext:
  fsGroup: 1000

# The image starts as its built-in "comfytoo" user (UID/GID 1025), which uses
# sudo to remap the "comfy" user to WANTED_UID/WANTED_GID and re-execs as it.
# Starting as root breaks this flow, so run as comfytoo and let it drop down.
securityContext:
  runAsNonRoot: true
  runAsUser: 1025
  runAsGroup: 1025

service:
  type: ClusterIP
  port: 8188
  targetPort: 8188

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
  host: comfyui.homelab.local
  tls:
    - secretName: comfyui-tls
      hosts:
        - comfyui.homelab.local

resources:
  limits:
    nvidia.com/gpu: 1   # one time-sliced GPU share
    memory: "16Gi"
    cpu: "4"
  requests:
    nvidia.com/gpu: 1
    memory: "4Gi"
    cpu: "1"

gpu:
  enabled: true
  resourceName: "nvidia.com/gpu"
  count: 1

persistence:
  enabled: true
  storageClass: ""          # K3s default (local-path)
  accessMode: ReadWriteOnce
  size: 80Gi
  # The image keeps user data (models, custom_nodes, input/output, workflows)
  # in /basedir and the venv/source/HF cache in /comfy/mnt. Both are persisted
  # via subPaths on a single PVC so restarts don't re-download torch/models.
  baseDir: /basedir
  runDir: /comfy/mnt

# Models downloaded by the download-models init container into
# <baseDir>/models/<dir>/<name> when missing (requires persistence). Adding an
# entry here + a push is how models get installed; removing one does NOT delete
# the file from the PVC. sha256 comes from the file's page on Hugging Face.
models:
  enabled: true
  image: curlimages/curl:8.23.0
  files:
    # FLUX.2 [klein] 4B (Apache 2.0), the distilled 4-step model. These are the
    # files the built-in "FLUX.2 [Klein] 4B: Text to Image" template expects.
    - name: flux-2-klein-4b.safetensors
      dir: diffusion_models
      url: https://huggingface.co/Comfy-Org/Flux-2-Klein-4B/resolve/main/split_files/diffusion_models/flux-2-klein-4b.safetensors
      sha256: ec3d4e733a771f61c052fb4856c48b336c55eaf2c65487c2a1faeb9bbda7a343
    - name: qwen_3_4b.safetensors
      dir: text_encoders
      url: https://huggingface.co/Comfy-Org/Flux-2-Klein-4B/resolve/main/split_files/text_encoders/qwen_3_4b.safetensors
      sha256: 6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a
    - name: flux2-vae.safetensors
      dir: vae
      url: https://huggingface.co/Comfy-Org/Flux-2-Klein-4B/resolve/main/split_files/vae/flux2-vae.safetensors
      sha256: 868fe7b343cc8f3a19dbcfcafbc3d5f888802be3f89bd81b65b3621a066ce8f3

tolerations: []

affinity: {}

nodeSelector: {}

runtimeClassName: "nvidia"

tailscale:
  enabled: true
  serviceName: comfyui
