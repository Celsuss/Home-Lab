---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "music-assistant.fullname" . }}-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "music-assistant.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.dataStorage }}
  storageClassName: {{ .Values.persistence.storageClassName }}
