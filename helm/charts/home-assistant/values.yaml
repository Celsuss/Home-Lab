---
replicaCount: 1                     # Home Assistant is single-instance; PVC is RWO
namespace: home-assistant

image:
  repository: ghcr.io/home-assistant/home-assistant
  pullPolicy: IfNotPresent
  tag: "2026.10.2"                  # pinned; bump deliberately (2026.9 renamed the LLM tools, see docs/plans/2026-10-12-mcp-improvements.md)

# Put the pod directly on the node's LAN so mDNS/DHCP device auto-discovery
# works (Chromecast, HomeKit, ESPHome, etc.). Disable to run as a normal
# ClusterIP pod (discovery of most devices will not work).
hostNetwork: true

# Sets the TZ env var inside the container.
timezone: "Europe/Stockholm"

# HA runs an s6-overlay init and writes to /config, so it needs to run as root.
securityContext:
  runAsNonRoot: false

service:
  type: ClusterIP
  port: 8123

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
  host: home-assistant.homelab.local
  tls:
    - secretName: home-assistant-tls
      hosts:
        - home-assistant.homelab.local

tailscale:
  enabled: true
  serviceName: home-assistant

# HACS (custom integrations/cards, needed for Frigate). Installed once by an
# init container, then self-updating from the UI. To reinstall a different
# release, delete /config/custom_components/hacs and bump these.
hacs:
  enabled: true
  version: "2.0.5"
  sha256: "97be6b824a4f38e683728cc6dd72367f6b8bad0a43428b1b3b987a3087adf413"
  installImage: "alpine:3.22"        # busybox wget (HTTPS via ssl_client), unzip, sha256sum

persistence:
  storageClassName: "local-path"
  configStorage: 10Gi               # holds SQLite recorder DB + config

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
