apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-assistant.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "home-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config-seed: {{ include (print $.Template.BasePath "/config-seed-configmap.yaml") . | sha256sum }}
        checksum/packages: {{ include (print $.Template.BasePath "/packages-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "home-assistant.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seed a working configuration.yaml on first boot only. We only copy
        # if no config exists yet so we never clobber the user's own edits on
        # later restarts.
        - name: config-seed
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/configuration.yaml ]; then
                echo "No configuration.yaml found, seeding default config"
                cp /seed/configuration.yaml /config/configuration.yaml
              else
                echo "configuration.yaml already exists, leaving it untouched"
              fi
              # Make sure the git-managed packages/ dir (mounted from a
              # ConfigMap) is actually loaded. Older seeds predate it; append
              # the include once if it's missing. If the file already has its
              # own `homeassistant:` block we can't merge safely — tell the
              # user instead of producing a duplicate key.
              if grep -q 'packages:' /config/configuration.yaml; then
                echo "packages already configured"
              elif grep -q '^homeassistant:' /config/configuration.yaml; then
                echo "WARNING: configuration.yaml has a 'homeassistant:' block without 'packages:'."
                echo "WARNING: add 'packages: !include_dir_named packages' under it by hand."
              else
                echo "Appending packages include to configuration.yaml"
                printf '\n# Added by the home-assistant Helm chart: YAML from git (helm/charts/home-assistant/packages/).\nhomeassistant:\n  packages: !include_dir_named packages\n' >> /config/configuration.yaml
              fi
              # HA >= 2026.10 configures `http:` from the UI (Settings >
              # System > Network) and imports an existing YAML block once;
              # the YAML block stops working in 2027.2. Older seeds wrote
              # one — drop it, but only after HA has imported it into
              # .storage so the proxy settings are never lost.
              if grep -q '^http:' /config/configuration.yaml; then
                if grep -rqs 'use_x_forwarded_for' /config/.storage; then
                  echo "Removing deprecated http: block (already imported by HA)"
                  awk '/^# Required so HA accepts requests forwarded by the Traefik ingress\.$/ { next }
                       /^http:/ { skip = 1; next }
                       skip && /^[^ \t]/ { skip = 0 }
                       !skip' /config/configuration.yaml > /config/configuration.yaml.tmp \
                    && mv /config/configuration.yaml.tmp /config/configuration.yaml
                else
                  echo "http: block present but not yet imported by HA, leaving it"
                fi
              fi
              # HA only creates these on a fresh onboarding (same contents as
              # HA would write); the seed's includes must not point at
              # missing files.
              [ -f /config/automations.yaml ] || echo '[]' > /config/automations.yaml
              [ -f /config/scripts.yaml ] || : > /config/scripts.yaml
              [ -f /config/scenes.yaml ] || : > /config/scenes.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: config-seed
              mountPath: /seed
        {{- if .Values.hacs.enabled }}
        # Install HACS (https://hacs.xyz) once, at a pinned and checksummed
        # release. After that HACS updates itself from the UI, so an
        # existing install is never touched. A failed download only logs a
        # warning: HA must still start without HACS.
        - name: hacs-install
          image: {{ .Values.hacs.installImage | quote }}
          command:
            - sh
            - -c
            - |
              dest=/config/custom_components/hacs
              if [ -f "$dest/manifest.json" ]; then
                echo "HACS already installed, leaving it to update itself"
                exit 0
              fi
              url="https://github.com/hacs/integration/releases/download/{{ .Values.hacs.version }}/hacs.zip"
              echo "Installing HACS {{ .Values.hacs.version }} from $url"
              if ! wget -q -O /tmp/hacs.zip "$url"; then
                echo "WARNING: HACS download failed, starting without it"
                exit 0
              fi
              if ! echo "{{ .Values.hacs.sha256 }}  /tmp/hacs.zip" | sha256sum -c -; then
                echo "WARNING: HACS checksum mismatch, not installing"
                exit 0
              fi
              mkdir -p "$dest"
              unzip -q -o /tmp/hacs.zip -d "$dest"
              echo "HACS installed; add it in Settings > Devices & services"
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: packages
              mountPath: /config/packages
              readOnly: true
            - name: dashboards
              mountPath: /config/dashboards
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "home-assistant.fullname" . }}-config-pvc
        - name: config-seed
          configMap:
            name: {{ include "home-assistant.fullname" . }}-config-seed
        - name: packages
          configMap:
            name: {{ include "home-assistant.fullname" . }}-packages
        - name: dashboards
          configMap:
            name: {{ include "home-assistant.fullname" . }}-dashboards
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
