# Calendar and chores automations — docs/plans/2026-10-12-proton-calendar.md,
# Phase 2, and docs/plans/2026-10-12-mcp-improvements.md, Phases 1b and 1c.
#
# Morning briefing: the Ollama agent reads today's calendar (homelab-mcp
# calendar_agenda), chores (list_chores) and lab status (lab_status, Uptime
# Kuma) and the answer goes to Telegram, and to the den speaker when
# input_boolean.morning_briefing_speak is on.
#
# Evening chore nudge: at 19:00 the agent checks list_chores and a Telegram
# message goes out only if a chore is due today or overdue.
#
# Event reminders: a Telegram message 15 minutes before each timed event. They
# use HA's own Remote Calendar integration on the same Proton share link,
# because automations can't trigger on an MCP tool. That entity must stay
# UNEXPOSED to Assist, or the model gets a second calendar tool next to
# calendar_agenda.
#
# Manual prerequisites (HA UI, see helm/charts/home-assistant/README.md,
# "Calendar"):
#   - homelab-mcp with PROTON_ICS_URL set (calendar_agenda in /healthz)
#   - Remote Calendar integration named "Proton" → calendar.proton, not exposed
#   - Telegram bot integration with your chat allow-listed. send_message has no
#     chat_id below: it goes to the bot's first allowed chat.
input_boolean:
  morning_briefing_speak:
    name: "Morning briefing on the den speaker"
    icon: mdi:account-voice

automation:
  - id: morning_briefing
    alias: "Morning briefing: calendar, chores and lab status"
    description: >
      At 07:00, ask the Ollama agent for today's calendar, due chores and
      anything down in the lab, and send the answer to Telegram (and speak it
      if the toggle is on).
    mode: single
    triggers:
      - trigger: time
        at: "07:00:00"
    actions:
      - action: conversation.process
        data:
          agent_id: conversation.ollama_conversation   # same agent as telegram.yaml
          text: >-
            Morning briefing. Call calendar_agenda for today, list_chores and
            lab_status, then tell me in at most four short sentences what is
            on my calendar today, which chores are due or overdue, and
            anything in the lab that is not up.
        response_variable: briefing
      - variables:
          message: >-
            {{ briefing.response.speech.plain.speech
               | default('The morning briefing got no answer from the assistant.', true) }}
      - action: telegram_bot.send_message
        data:
          parse_mode: plain_text       # LLM output is not valid Markdown
          message: "{{ message }}"
      - if:
          - condition: state
            entity_id: input_boolean.morning_briefing_speak
            state: "on"
        then:
          - action: tts.speak
            target:
              entity_id: tts.piper
            data:
              media_player_entity_id: media_player.den_speaker
              message: "{{ message }}"
              language: en_US
              options:
                voice: en_US-glados-medium

  - id: evening_chore_nudge
    alias: "Evening chore nudge"
    description: >
      At 19:00, ask the Ollama agent whether any chore is due today or
      overdue. Telegram only (no speaker in the evening), and nothing is sent
      when the agent answers NONE.
    mode: single
    triggers:
      - trigger: time
        at: "19:00:00"
    actions:
      - action: conversation.process
        data:
          agent_id: conversation.ollama_conversation
          # list_chores also returns future chores: the model filters by date.
          # Keep in sync with the case in docker/homelab-mcp/eval/cases.yaml.
          text: >-
            Evening check. Call list_chores. If no chore is due today or
            overdue, reply only NONE. Otherwise name them in at most two short
            sentences.
        response_variable: nudge
      - variables:
          message: "{{ nudge.response.speech.plain.speech | default('', true) | trim }}"
      # Silent when nothing is due. Letters only, so "None." or "NONE" count;
      # an empty reply (agent error) is skipped too rather than sent.
      - condition: template
        value_template: >-
          {{ message | upper | regex_replace('[^A-Z]', '') not in ['NONE', ''] }}
      - action: telegram_bot.send_message
        data:
          parse_mode: plain_text
          message: "{{ message }}"

  - id: calendar_event_reminder
    alias: "Calendar: Telegram reminder before an event"
    description: >
      15 minutes before each timed event on calendar.proton (Remote
      Calendar), send its title, time and place to Telegram. All-day events
      are skipped; the morning briefing covers them.
    mode: queued                       # two events can start at the same time
    max: 10
    triggers:
      - trigger: calendar
        event: start
        entity_id: calendar.proton
        offset: "-00:15:00"
    conditions:
      - condition: template
        value_template: "{{ not trigger.calendar_event.all_day }}"
    actions:
      - action: telegram_bot.send_message
        data:
          parse_mode: plain_text
          message: >-
            In 15 minutes, at {{ as_local(as_datetime(trigger.calendar_event.start)).strftime('%H:%M') }}:
            {{ trigger.calendar_event.summary }}{% if trigger.calendar_event.location %}
            @ {{ trigger.calendar_event.location }}{% endif %}

  - id: calendar_proton_refresh
    alias: "Calendar: refresh calendar.proton hourly"
    description: >
      Remote Calendar only polls every 24 hours, so reminders would miss
      events added during the day. Proton's share link itself lags by up to
      8 hours, so hourly is plenty.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: 5
    conditions:
      - condition: template              # quiet until the integration is set up
        value_template: "{{ states.calendar.proton is not none }}"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: calendar.proton
